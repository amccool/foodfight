name: port

on:
  push:
    branches: [feature/xbox-one-port]
  pull_request:
    paths: ['port/**']
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Desktop head
        run: dotnet build port/FoodFight.Desktop -c Release

      - name: Headless selftest
        run: dotnet run --project port/FoodFight.Desktop -c Release --no-build -- --selftest

      - name: Publish win-x64
        run: dotnet publish port/FoodFight.Desktop -c Release -r win-x64 --self-contained -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: FoodFight-MonoGame-win64
          path: publish
